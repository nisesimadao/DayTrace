name: Package iOS IPA

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example: 1.0-beta.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Xcode version
        run: xcodebuild -version
      - name: Determine release metadata
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            VERSION="${GITHUB_REF_NAME#release/}"
          else
            VERSION="${REQUESTED_VERSION#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "ipa=DayTrace-v$VERSION-unsigned.ipa" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Unit tests
        run: >-
          xcodebuild
          -project Daytrace.xcodeproj
          -scheme Daytrace
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          -resultBundlePath ReleaseTests.xcresult
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Build iPhoneOS application
        run: >-
          xcodebuild
          -project Daytrace.xcodeproj
          -scheme Daytrace
          -configuration Release
          -sdk iphoneos
          -derivedDataPath "$RUNNER_TEMP/DayTraceDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Package application
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IPA_FILE: ${{ steps.release.outputs.ipa }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DayTraceDerivedData/Build/Products/Release-iphoneos/Daytrace.app"
          test -d "$APP"
          mkdir -p dist/Payload
          ditto "$APP" dist/Payload/Daytrace.app
          (cd dist && zip -qry "$IPA_FILE" Payload)
          (cd dist && shasum -a 256 "$IPA_FILE" > "$IPA_FILE.sha256")
          test -s "dist/$IPA_FILE"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayTrace-${{ steps.release.outputs.tag }}-unsigned-IPA
          path: |
            dist/*.ipa
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          IPA_FILE: ${{ steps.release.outputs.ipa }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="DayTrace ${TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/$IPA_FILE" \
              "dist/$IPA_FILE.sha256" \
              --clobber
          elif [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release create "$TAG" \
              "dist/$IPA_FILE" \
              "dist/$IPA_FILE.sha256" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "$TAG" \
              "dist/$IPA_FILE" \
              "dist/$IPA_FILE.sha256" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md
          fi
