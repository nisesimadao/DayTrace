name: iOS build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project Daytrace.xcodeproj
          -scheme Daytrace
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Unit tests
        run: >-
          xcodebuild
          -project Daytrace.xcodeproj
          -scheme Daytrace
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Upload failed test result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DayTrace-xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
